plugins {
    id 'com.android.application'
}

android {
    namespace 'com.deportes.channel'
    compileSdk 34

    defaultConfig {
        applicationId "com.deportes.channel"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.tvprovider:tvprovider:1.0.0'
}
